<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656" fill="none" role="img" aria-label="Hiring, or have a product to build? Email, schedule a call, WhatsApp, LinkedIn or GitHub.">
  <style>
    .in, .draw, .retract, .pulse, .float, .drift, .rise { transform-box: fill-box; }
    @media (prefers-reduced-motion: no-preference) {
      .in { animation: in 14s cubic-bezier(0.16, 1, 0.3, 1) infinite both; }
      .draw { transform-origin: left center; animation: draw 14s cubic-bezier(0.16, 1, 0.3, 1) infinite both; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .float { transform-origin: center; animation: float 9s ease-in-out infinite alternate; }
      .retract { transform-origin: right center; animation: retract 14s cubic-bezier(0.16, 1, 0.3, 1) infinite both; }
      .drift { animation: drift 18s ease-in-out infinite alternate; }
      .rise { animation: rise 14s cubic-bezier(0.16, 1, 0.3, 1) infinite both; }
    }
    @keyframes in { 0% { opacity: 0; transform: translateY(12px); } 6%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes draw { 0% { transform: scaleX(0); } 9%, 95% { transform: scaleX(1); } 100% { transform: scaleX(0); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes float { from { transform: translateY(4px) rotate(-0.6deg); } to { transform: translateY(-8px) rotate(0.6deg); } }
    @keyframes drift { from { transform: translateX(-36px); } to { transform: translateX(36px); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(28px); } 10%, 95% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  </style>
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#7aa6ff" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".15" stop-color="#fff"/>
      <stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="656" fill="url(#fadeY)"/></mask>
    <clipPath id="frame"><rect width="1200" height="656" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="656" fill="#030407"/>
    <g class="in" style="animation-delay:0.00s">
      <text x="64.0" y="96.0" fill="#e8eef9" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="500" text-anchor="start" letter-spacing="-1.3">Hiring, or have a product to build?</text>
      <text x="64.0" y="140.0" fill="#8c98b0" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" text-anchor="start">I’m Leonardo Lopes, a tech lead, software engineer and architect working</text>
      <text x="64.0" y="167.0" fill="#8c98b0" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" text-anchor="start">remotely from Brazil (UTC−3). Every channel below reaches me directly.</text>
    </g>
    <path d="M64 230 H1136" stroke="#fff" stroke-opacity=".12"/>
    <g class="in" style="animation-delay:0.20s"><g transform="translate(64.0 256.0) scale(0.917)" fill="none" stroke="#7aa6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g><text x="104.0" y="264.0" fill="#e8eef9" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" text-anchor="start">Email</text><text x="104.0" y="288.0" fill="#8c98b0" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" text-anchor="start">leonardolopesdeveloper@gmail.com</text><g transform="translate(1114.0 256.0) scale(0.917)" fill="none" stroke="#8c98b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g></g>
    <path d="M64 304 H1136" stroke="#fff" stroke-opacity=".12"/>
    <g class="in" style="animation-delay:0.30s"><g transform="translate(64.0 330.0) scale(0.917)" fill="none" stroke="#7aa6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></g><text x="104.0" y="349.0" fill="#e8eef9" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" text-anchor="start">Schedule a call</text><g transform="translate(1114.0 330.0) scale(0.917)" fill="none" stroke="#8c98b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g></g>
    <path d="M64 378 H1136" stroke="#fff" stroke-opacity=".12"/>
    <g class="in" style="animation-delay:0.40s"><g transform="translate(64.0 404.0) scale(0.917)" fill="none" stroke="#7aa6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></g><text x="104.0" y="423.0" fill="#e8eef9" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" text-anchor="start">WhatsApp</text><g transform="translate(1114.0 404.0) scale(0.917)" fill="none" stroke="#8c98b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g></g>
    <path d="M64 452 H1136" stroke="#fff" stroke-opacity=".12"/>
    <g class="in" style="animation-delay:0.50s"><g transform="translate(64.0 478.0) scale(0.917)" fill="none" stroke="#7aa6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></g><text x="104.0" y="497.0" fill="#e8eef9" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" text-anchor="start">LinkedIn</text><g transform="translate(1114.0 478.0) scale(0.917)" fill="none" stroke="#8c98b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g></g>
    <path d="M64 526 H1136" stroke="#fff" stroke-opacity=".12"/>
    <g class="in" style="animation-delay:0.60s"><g transform="translate(64.0 552.0) scale(0.917)" fill="none" stroke="#7aa6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></g><text x="104.0" y="571.0" fill="#e8eef9" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" text-anchor="start">GitHub</text><g transform="translate(1114.0 552.0) scale(0.917)" fill="none" stroke="#8c98b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g></g>
    <path d="M64 600 H1136" stroke="#fff" stroke-opacity=".12"/>

  </g>
  <rect x=".5" y=".5" width="1199" height="655" rx="23.5" stroke="#fff" stroke-opacity=".08"/>
</svg>
