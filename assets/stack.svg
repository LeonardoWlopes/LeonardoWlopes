      <stop offset=".85" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="660" fill="url(#fadeY)"/></mask>
    <clipPath id="frame"><rect width="1200" height="660" rx="24"/></clipPath>
  </defs>
